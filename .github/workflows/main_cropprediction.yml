name: Build and deploy CropPrediction ML models to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version  # Debug: Confirm Python version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Models/ Cropprice.csv predict.py requirements.txt
          ls -l release.zip  # Debug: Confirm zip file creation

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: crop-prediction-app
          path: release.zip
          if-no-files-found: error  # Fail if zip file is missing

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: crop-prediction-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          ls -l  # Debug: Confirm unzipped files

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@v0.1.5
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "Models/,Cropprice.csv,predict.py,requirements.txt"
          target: "/root/crop-prediction/"
          strip_components: 0  # Ensure files are copied directly to target

      - name: Start prediction service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /root/crop-prediction

            # Fix file permissions
            chown root:root Cropprice.csv predict.py requirements.txt
            chmod 644 Cropprice.csv predict.py requirements.txt

            # Create and activate virtual environment
            rm -rf venv  # Remove old venv if exists
            python3 -m venv venv
            source venv/bin/activate

            # Install dependencies inside venv
            pip install -r requirements.txt

            # Kill old process if running
            pkill -f 'python predict.py' || true

            # Run prediction script with nohup
            nohup venv/bin/python predict.py > app.log 2>&1 &

            # Wait briefly and check if the process is running
            sleep 5
            if pgrep -f 'python predict.py' > /dev/null; then
              echo "Flask app started successfully"
            else
              echo "Failed to start Flask app"
              cat app.log
              exit 1
            fi

            # Verify the app is responding (optional)
            curl --fail --silent --show-error http://localhost:5000/ || {
              echo "Flask app is not responding"
              cat app.log
              exit 1
            }
