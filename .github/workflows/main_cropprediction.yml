name: Build and deploy ML model to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train ML model (example)
        run: |
          python train_model.py  # Replace with your training script
          # Assuming model is saved as model.pkl
          ls -la model.pkl || echo "Model training failed or file not found"

      - name: Zip artifact for deployment
        run: zip release.zip model.pkl inference.py requirements.txt -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ml-model
          path: release.zip
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ml-model

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@master
        with:
          host: 139.59.10.226
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "model.pkl, inference.py, requirements.py"
          target: "/root/ml-app/"

      - name: Start ML inference service
        uses: appleboy/ssh-action@master
        with:
          host: 139.59.10.226
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /root/ml-app
            # Install dependencies if needed
            pip install -r requirements.txt || echo "Dependencies already installed"
            # Kill existing process if running
            pkill -f 'python inference.py' || true
            # Start inference script with nohup
            nohup python inference.py > app.log 2>&1 &
