name: Build and deploy Crop Recommendation ML model to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Models/ Cropprice.csv predict.py requirements.txt
          ls -l release.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: crop-recommendation-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          ls -l

      - name: Deploy to Azure VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "Models/,Cropprice.csv,predict.py,requirements.txt"
          target: "/home/${{ secrets.AZURE_VM_USERNAME }}/crop-recommendation/"
          strip_components: 0

      - name: Start recommendation service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e

            cd /home/${{ secrets.AZURE_VM_USERNAME }}/crop-recommendation

            echo "Fixing file permissions..."
            sudo chown $USER:$USER Cropprice.csv predict.py requirements.txt
            chmod 644 Cropprice.csv predict.py requirements.txt
            sudo chown $USER:$USER app.log || true
            chmod 644 app.log || true

            echo "Checking port 8081..."
            if sudo netstat -tuln | grep :8081; then
              echo "Port 8081 is in use, killing process..."
              sudo lsof -i :8081 | grep LISTEN | awk '{print $2}' | sudo xargs kill -9 || true
              sleep 2
            fi

            echo "Checking memory usage..."
            free -m

            echo "Stopping existing service..."
            sudo systemctl stop crop-recommendation.service || true

            echo "Setting up virtual environment..."
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate

            echo "Installing dependencies with retry..."
            for i in {1..3}; do
              pip install --no-cache-dir -r requirements.txt && break
              echo "pip install failed, retrying ($i/3)..."
              sleep 5
              if [ $i -eq 3 ]; then
                echo "Failed to install dependencies after 3 attempts"
                exit 1
              fi
            done

            echo "Setting up systemd service..."
            sudo tee /etc/systemd/system/crop-recommendation.service > /dev/null << 'EOF'
            [Unit]
            Description=Crop Recommendation Flask App
            After=network.target

            [Service]
            Type=simple
            User=$USER
            WorkingDirectory=/home/$USER/crop-recommendation
            Environment="PORT=8081"
            ExecStart=/home/$USER/crop-recommendation/venv/bin/python /home/$USER/crop-recommendation/predict.py
            Restart=always
            StandardOutput=append:/home/$USER/crop-recommendation/app.log
            StandardError=append:/home/$USER/crop-recommendation/app.log
            MemoryMax=2500M

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "Reloading systemd and starting service..."
            sudo systemctl daemon-reload
            sudo systemctl enable crop-recommendation.service
            sudo systemctl restart crop-recommendation.service

            echo "Waiting for Flask app to start (up to 5 minutes)..."
            for i in {1..30}; do
              if curl --fail --silent --show-error http://localhost:8081/; then
                echo "Flask app is responding"
                break
              fi
              echo "Attempt $i/30: Flask app not yet responding, waiting 10 seconds..."
              sleep 10
              if [ $i -eq 30 ]; then
                echo "Flask app failed to start within 5 minutes"
                sudo systemctl status crop-recommendation.service
                sudo journalctl -u crop-recommendation.service -n 50
                cat app.log
                free -m
                exit 1
              fi
            done

            if sudo systemctl is-active --quiet crop-recommendation.service; then
              echo "Flask app started successfully via systemd"
              echo "Application is accessible at: http://${{ secrets.AZURE_VM_HOST }}:8081"
            else
              echo "Failed to start Flask app via systemd"
              sudo systemctl status crop-recommendation.service
              sudo journalctl -u crop-recommendation.service -n 50
              cat app.log
              free -m
              exit 1
            fi
