name: Build and deploy CropPrediction ML models to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Models/ Cropprice.csv predict.py requirements.txt
          ls -l release.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: crop-prediction-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: crop-prediction-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          ls -l

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@v0.1.5
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "Models/,Cropprice.csv,predict.py,requirements.txt"
          target: "/root/crop-prediction/"
          strip_components: 0

      - name: Start prediction service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            set -e

            cd /root/crop-prediction

            echo "Fixing file permissions..."
            chown root:root Cropprice.csv predict.py requirements.txt
            chmod 644 Cropprice.csv predict.py requirements.txt
            chown root:root app.log || true
            chmod 644 app.log || true

            echo "Checking port 5000..."
            if netstat -tuln | grep :5000; then
              echo "Port 5000 is in use, killing process..."
              lsof -i :5000 | grep LISTEN | awk '{print $2}' | xargs kill -9 || true
              sleep 2
            fi

            echo "Checking memory usage..."
            free -m

            echo "Stopping existing service..."
            systemctl stop crop-prediction.service || true

            echo "Setting up virtual environment..."
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate

            echo "Installing dependencies with retry..."
            for i in {1..3}; do
              pip install --no-cache-dir -r requirements.txt && break
              echo "pip install failed, retrying ($i/3)..."
              sleep 5
              if [ $i -eq 3 ]; then
                echo "Failed to install dependencies after 3 attempts"
                exit 1
              fi
            done

            echo "Setting up systemd service..."
            cat > /etc/systemd/system/crop-prediction.service << 'EOF'
            [Unit]
            Description=Crop Prediction Flask App
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/root/crop-prediction
            ExecStart=/root/crop-prediction/venv/bin/python /root/crop-prediction/predict.py
            Restart=always
            StandardOutput=append:/root/crop-prediction/app.log
            StandardError=append:/root/crop-prediction/app.log
            MemoryLimit=700M

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "Reloading systemd and starting service..."
            systemctl daemon-reload
            systemctl enable crop-prediction.service
            systemctl restart crop-prediction.service

            sleep 15
            if systemctl is-active --quiet crop-prediction.service; then
              echo "Flask app started successfully via systemd"
            else
              echo "Failed to start Flask app via systemd"
              systemctl status crop-prediction.service
              journalctl -u crop-prediction.service -n 50
              cat app.log
              free -m
              exit 1
            fi

            curl --fail --silent --show-error http://localhost:5000/ || {
              echo "Flask app is not responding"
              cat app.log
              journalctl -u crop-prediction.service -n 50
              free -m
              exit 1
            }
